{% assign locale = site.data.i18n[page.lang] %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="{{ locale.navigation_label }}">
        <button aria-label="{{ locale.more_navigation }}"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="{{ locale.home_url | relative_url }}">{{ locale.name }}</a></li>
          {% for link in site.data.navigation.main %}
          <li class="masthead__menu-item"><a href="{{ locale.home_url | append: link.anchor | relative_url }}">{{ locale[link.key] }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    {% include language-switch.html %}
  </div>
</div>
