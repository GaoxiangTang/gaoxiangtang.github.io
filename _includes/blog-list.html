{% if site.posts.size > 0 %}
<ul class="blog-list">
  {% for post in site.posts %}
  {% if post.lang == page.lang %}
  <li><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time> <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></li>
  {% endif %}
  {% endfor %}
</ul>
{% endif %}
